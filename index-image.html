<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Art Animator - Images</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="status">Upload any image to transform it into animated ASCII art</div>
        <input type="file" id="imageInput" accept="image/*">
        <canvas id="canvas"></canvas>
        <div class="info">
            💡 Works with: photos, artwork, screenshots, text, faces, landscapes, anything!<br>
            ✨ Characters change every frame for a living, glitchy effect
        </div>
        <div class="credit">⚡ ASCII Art Animator (Images) ⚡</div>
    </div>

    <script src="script-image.js"></script>
</body>
</html>
